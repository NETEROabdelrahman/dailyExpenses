workflows:
  android-debug:
    name: Daily Android Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Make Gradle wrapper executable
        script: chmod +x android/gradlew
      - name: Lint
        script: npm run lint
      - name: Test
        script: npm test -- --runInBand
      - name: Build debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/reports/**/*

  android-release:
    name: Daily Android Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - daily_keystore
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/.gradle/caches
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Make Gradle wrapper executable
        script: chmod +x android/gradlew
      - name: Lint
        script: npm run lint
      - name: Test
        script: npm test -- --runInBand
      - name: Build release APK
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/mapping/**/mapping.txt

  ios-release:
    name: Daily iOS Release
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.daily
      vars:
        XCODE_WORKSPACE: "ios/DailyExpenses.xcworkspace"
        XCODE_SCHEME: "DailyExpenses"
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Ruby gems
        script: bundle install
      - name: Install CocoaPods
        script: |
          cd ios
          bundle exec pod install
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
